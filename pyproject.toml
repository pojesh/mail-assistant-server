[project]
name = "mail-assistant-server"
version = "0.1.0"
description = "AI mail assistant backend: triage, drafting, scheduling and chat over Gmail + Google Calendar."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.1",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "httplib2>=0.32.1",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "langchain>=1.4.9",
    "langchain-core>=1.7.6",
    "langchain-google-genai>=4.4.3",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "requests>=2.34.2",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "python-dotenv>=1.2.4",
    "respx>=0.23.1",
    "ruff>=0.17.4",
    "types-requests>=2.33.0.20261030",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/F: errors, I: import order, UP: modern syntax, B: likely bugs, SIM: simpler code, N: naming
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ASYNC", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # allow unicode punctuation in strings/docs
    "N818",  # exception names follow the spec (NotFound, NeedsReconnect, ...)
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # the local alembic/ folder is not our package

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in defaults is the intended style.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Cookie"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
# These Google libraries ship without type hints.
module = ["googleapiclient.*", "google_auth_oauthlib.*", "google_auth_httplib2", "httplib2", "slowapi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# google-auth has partial type hints; allow calling its untyped functions from our Google layer.
module = ["app.google.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests/unit", "tests/integration"]
markers = ["real_llm: calls real model APIs (tests/scenarios only, run on demand)"]
